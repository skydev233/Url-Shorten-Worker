<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Refresh" content="1; url={Replace}" />
  <meta name="referrer" content="no-referrer" />
  <title>Redirecting&hellip;</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/500.css">
  <style>
    :root {
      color-scheme: light dark;
      --md-primary: #6750a4;
      --md-on-primary: #ffffff;
      --md-primary-container: #eaddff;
      --md-on-primary-container: #21005d;
      --md-error: #b3261e;
      --md-on-error: #ffffff;
      --md-error-container: #f9dedc;
      --md-on-error-container: #410e0b;
      --md-background: #fffbfe;
      --md-on-background: #1c1b1f;
      --md-surface: #fffbfe;
      --md-on-surface: #1c1b1f;
      --md-surface-variant: #e7e0ec;
      --md-on-surface-variant: #49454f;
      --md-outline-variant: #cac4d0;
      --md-surface-container-low: #f7f2fa;
      --md-surface-container-high: #ece6f0;
      --md-surface-container-highest: #e6e0e9;
      --md-elev-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
      --md-shape-md: 12px;
      --md-shape-xl: 28px;
      --md-font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --md-headline-small: 400 24px/32px var(--md-font);
      --md-title-medium: 500 16px/24px var(--md-font);
      --md-body-large: 400 16px/24px var(--md-font);
      --md-body-medium: 400 14px/20px var(--md-font);
      --md-label-large: 500 14px/20px var(--md-font);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #d0bcff;
        --md-on-primary: #381e72;
        --md-primary-container: #4f378b;
        --md-on-primary-container: #eaddff;
        --md-error: #f2b8b5;
        --md-on-error: #601410;
        --md-error-container: #8c1d18;
        --md-on-error-container: #f9dedc;
        --md-background: #1c1b1f;
        --md-on-background: #e6e1e5;
        --md-surface: #1c1b1f;
        --md-on-surface: #e6e1e5;
        --md-surface-variant: #49454f;
        --md-on-surface-variant: #cac4d0;
        --md-outline-variant: #49454f;
        --md-surface-container-low: #1d1b20;
        --md-surface-container-high: #2b2930;
        --md-surface-container-highest: #36343b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: var(--md-body-medium);
      font-family: var(--md-font);
      background: var(--md-background);
      color: var(--md-on-background);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .m3-card {
      width: 100%;
      max-width: 400px;
      background: var(--md-surface-container-low);
      border-radius: var(--md-shape-xl);
      box-shadow: var(--md-elev-1);
      padding: 40px 28px;
      text-align: center;
    }

    .m3-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 4px solid var(--md-primary-container);
      border-top-color: var(--md-primary);
      animation: m3-spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes m3-spin { to { transform: rotate(360deg); } }

    .m3-title { font: var(--md-headline-small); color: var(--md-on-surface); margin-bottom: 8px; }
    .m3-subtitle { font: var(--md-body-medium); color: var(--md-on-surface-variant); margin-bottom: 16px; }

    .m3-dest {
      display: block;
      font: var(--md-body-medium);
      color: var(--md-primary);
      text-decoration: none;
      word-break: break-all;
      padding: 12px 16px;
      background: var(--md-surface-container-highest);
      border-radius: var(--md-shape-md);
    }
    .m3-dest:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="page">
    <div class="m3-card">
      <div class="m3-spinner" aria-hidden="true"></div>
      <h1 class="m3-title" data-i18n="title">Redirecting&hellip;</h1>
      <p class="m3-subtitle" data-i18n="subtitle">Taking you to your destination now.</p>
      <a class="m3-dest" href="{Replace}">{Replace}</a>
    </div>
  </main>
  <script>
    (function () {
      var I18N = {
        'en': {
          'meta.title': 'Redirecting…',
          'title': 'Redirecting…',
          'subtitle': 'Taking you to your destination now.'
        },
        'zh-CN': {
          'meta.title': '正在跳转…',
          'title': '正在跳转…',
          'subtitle': '正在前往目标网址。'
        }
      };

      var currentLocale = 'zh-CN';

      function t(key) {
        var dict = I18N[currentLocale] || I18N.en || {};
        return dict[key] != null ? dict[key] : (I18N.en && I18N.en[key] != null ? I18N.en[key] : key);
      }

      function apply() {
        document.documentElement.lang = currentLocale;
        document.title = t('meta.title');
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
      }

      document.addEventListener('DOMContentLoaded', apply);
    })();

    setTimeout(function () {
      window.location.replace("{Replace}" + window.location.hash);
    }, 1000);
  </script>
</body>
</html>
