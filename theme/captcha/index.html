<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Fast, Secure, and Reliable URL Shortening Service">
  <title>URL Shortener · Fast &amp; Secure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto@5.0.8/700.css">
  <script src="https://captcha.gurl.eu.org/cap.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --md-primary: #6750a4;
      --md-on-primary: #ffffff;
      --md-primary-container: #eaddff;
      --md-on-primary-container: #21005d;
      --md-secondary: #625b71;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #e8def8;
      --md-on-secondary-container: #1d192b;
      --md-tertiary: #7d5260;
      --md-on-tertiary: #ffffff;
      --md-tertiary-container: #ffd8e4;
      --md-on-tertiary-container: #31111d;
      --md-error: #b3261e;
      --md-on-error: #ffffff;
      --md-error-container: #f9dedc;
      --md-on-error-container: #410e0b;
      --md-background: #fffbfe;
      --md-on-background: #1c1b1f;
      --md-surface: #fffbfe;
      --md-on-surface: #1c1b1f;
      --md-surface-variant: #e7e0ec;
      --md-on-surface-variant: #49454f;
      --md-outline: #79747e;
      --md-outline-variant: #cac4d0;
      --md-surface-container-lowest: #ffffff;
      --md-surface-container-low: #f7f2fa;
      --md-surface-container: #f3edf7;
      --md-surface-container-high: #ece6f0;
      --md-surface-container-highest: #e6e0e9;
      --md-inverse-surface: #313033;
      --md-inverse-on-surface: #f4eff4;
      --md-inverse-primary: #d0bcff;
      --md-scrim: rgba(0, 0, 0, 0.4);
      --md-elev-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
      --md-elev-2: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
      --md-elev-3: 0 1px 3px rgba(0, 0, 0, 0.3), 0 4px 8px 3px rgba(0, 0, 0, 0.15);
      --md-elev-4: 0 2px 3px rgba(0, 0, 0, 0.3), 0 6px 10px 4px rgba(0, 0, 0, 0.15);
      --md-shape-xs: 4px;
      --md-shape-sm: 8px;
      --md-shape-md: 12px;
      --md-shape-lg: 16px;
      --md-shape-xl: 28px;
      --md-shape-full: 999px;
      --md-font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --md-display-small: 400 36px/44px var(--md-font);
      --md-headline-small: 400 24px/32px var(--md-font);
      --md-title-large: 400 22px/28px var(--md-font);
      --md-body-large: 400 16px/24px var(--md-font);
      --md-body-medium: 400 14px/20px var(--md-font);
      --md-label-large: 500 14px/20px var(--md-font);
      --md-label-medium: 500 12px/16px var(--md-font);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #d0bcff;
        --md-on-primary: #381e72;
        --md-primary-container: #4f378b;
        --md-on-primary-container: #eaddff;
        --md-secondary: #ccc2dc;
        --md-on-secondary: #332d41;
        --md-secondary-container: #4a4458;
        --md-on-secondary-container: #e8def8;
        --md-tertiary: #efb8c8;
        --md-on-tertiary: #492532;
        --md-tertiary-container: #633b48;
        --md-on-tertiary-container: #ffd8e4;
        --md-error: #f2b8b5;
        --md-on-error: #601410;
        --md-error-container: #8c1d18;
        --md-on-error-container: #f9dedc;
        --md-background: #1c1b1f;
        --md-on-background: #e6e1e5;
        --md-surface: #1c1b1f;
        --md-on-surface: #e6e1e5;
        --md-surface-variant: #49454f;
        --md-on-surface-variant: #cac4d0;
        --md-outline: #938f99;
        --md-outline-variant: #49454f;
        --md-surface-container-lowest: #0f0d13;
        --md-surface-container-low: #1d1b20;
        --md-surface-container: #211f26;
        --md-surface-container-high: #2b2930;
        --md-surface-container-highest: #36343b;
        --md-inverse-surface: #e6e1e5;
        --md-inverse-on-surface: #313033;
        --md-inverse-primary: #6750a4;
        --md-scrim: rgba(0, 0, 0, 0.6);
        --md-elev-1: 0 1px 3px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.3);
        --md-elev-2: 0 2px 6px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.3);
        --md-elev-3: 0 4px 8px 3px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.3);
        --md-elev-4: 0 6px 10px 4px rgba(0, 0, 0, 0.15), 0 2px 3px rgba(0, 0, 0, 0.3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: var(--md-body-medium);
      font-family: var(--md-font);
      background: var(--md-background);
      color: var(--md-on-background);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .m3-card {
      position: relative;
      width: 100%;
      max-width: 560px;
      background: var(--md-surface-container-low);
      border-radius: var(--md-shape-xl);
      box-shadow: var(--md-elev-1);
      overflow: hidden;
    }
    .m3-card__header { padding: 32px 28px 0; text-align: center; }
    .m3-card__body { padding: 24px 28px 24px; }
    .m3-card__footer {
      padding: 12px 28px;
      border-top: 1px solid var(--md-outline-variant);
      text-align: center;
    }

    .m3-headline { font: var(--md-headline-small); color: var(--md-on-surface); margin-bottom: 8px; }
    .m3-subtitle { font: var(--md-body-medium); color: var(--md-on-surface-variant); }

    .m3-lang {
      position: absolute;
      top: 20px;
      right: 24px;
      display: inline-flex;
      gap: 4px;
      z-index: 2;
    }
    .m3-chip {
      position: relative;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--md-outline);
      background: transparent;
      color: var(--md-primary);
      border-radius: var(--md-shape-sm);
      font: var(--md-label-medium);
      cursor: pointer;
      overflow: hidden;
    }
    .m3-chip::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 0.15s ease; }
    .m3-chip:hover::after { opacity: 0.08; }
    .m3-chip.active { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-color: transparent; }

    .m3-text-field { position: relative; display: block; margin-bottom: 16px; }
    .m3-text-field__input {
      width: 100%;
      height: 56px;
      padding: 22px 16px 6px;
      font: var(--md-body-large);
      font-family: var(--md-font);
      color: var(--md-on-surface);
      background: var(--md-surface-container-highest);
      border: none;
      border-bottom: 1px solid var(--md-on-surface-variant);
      border-radius: var(--md-shape-xs) var(--md-shape-xs) 0 0;
      outline: none;
      caret-color: var(--md-primary);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .m3-text-field__input::placeholder { color: transparent; }
    .m3-text-field__input:hover { background: var(--md-surface-container-high); }
    .m3-text-field__input:focus {
      background: var(--md-surface-container-high);
      border-bottom: 2px solid var(--md-primary);
      padding-bottom: 5px;
    }
    .m3-text-field__input.m3-invalid { border-bottom-color: var(--md-error); }
    .m3-text-field__label {
      position: absolute;
      left: 16px;
      top: 16px;
      font: var(--md-body-large);
      color: var(--md-on-surface-variant);
      pointer-events: none;
      transition: top 0.15s ease, font-size 0.15s ease, color 0.15s ease;
    }
    .m3-text-field__input:focus ~ .m3-text-field__label,
    .m3-text-field__input:not(:placeholder-shown) ~ .m3-text-field__label {
      top: 6px;
      font-size: 12px;
      color: var(--md-primary);
    }
    .m3-text-field__input.m3-invalid ~ .m3-text-field__label { color: var(--md-error); }

    .m3-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 24px;
      border: none;
      border-radius: var(--md-shape-full);
      font: var(--md-label-large);
      letter-spacing: 0.1px;
      color: var(--md-on-primary);
      background: var(--md-primary);
      cursor: pointer;
      overflow: hidden;
      user-select: none;
      box-shadow: var(--md-elev-1);
      transition: box-shadow 0.2s ease;
      white-space: nowrap;
    }
    .m3-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .m3-btn:hover { box-shadow: var(--md-elev-2); }
    .m3-btn:hover::after { opacity: 0.08; }
    .m3-btn:active::after { opacity: 0.12; }
    .m3-btn:disabled { background: var(--md-on-surface); opacity: 0.12; box-shadow: none; cursor: default; }
    .m3-btn:disabled::after { opacity: 0; }
    .m3-btn--tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
    .m3-btn--outlined { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); box-shadow: none; }
    .m3-btn--text { background: transparent; color: var(--md-primary); box-shadow: none; padding: 0 12px; }
    .m3-btn--error { background: var(--md-error); color: var(--md-on-error); }
    .m3-btn__label { display: inline-flex; align-items: center; gap: 8px; }
    .m3-btn--block { width: 100%; }

    .m3-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: currentColor;
      animation: m3-spin 0.7s linear infinite;
    }
    @keyframes m3-spin { to { transform: rotate(360deg); } }

    .m3-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      border-radius: var(--md-shape-full);
      font: var(--md-label-large);
      color: var(--md-primary);
      text-decoration: none;
      overflow: hidden;
    }
    .m3-link::after {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .m3-link:hover::after { opacity: 0.08; }
    .m3-link:active::after { opacity: 0.12; }

    .m3-copyright {
      margin-top: 10px;
      font: var(--md-body-medium);
      color: var(--md-on-surface-variant);
    }

    .m3-notice {
      padding: 12px 16px;
      border-radius: var(--md-shape-md);
      font: var(--md-body-medium);
      margin-top: 16px;
      line-height: 1.5;
    }
    .m3-notice--success { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .m3-notice--error { background: var(--md-error-container); color: var(--md-on-error-container); }

    .m3-scrim {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--md-scrim);
      padding: 24px;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .m3-scrim.open { visibility: visible; opacity: 1; }
    .m3-dialog {
      width: 100%;
      max-width: 400px;
      background: var(--md-surface-container-high);
      border-radius: var(--md-shape-xl);
      padding: 24px;
      color: var(--md-on-surface);
      box-shadow: var(--md-elev-4);
      transform: scale(0.9);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .m3-scrim.open .m3-dialog { transform: scale(1); }
    .m3-dialog__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .m3-dialog__title { font: var(--md-title-large); }
    .m3-icon-btn {
      position: relative;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--md-on-surface-variant);
      font-size: 18px;
      cursor: pointer;
      overflow: hidden;
    }
    .m3-icon-btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 0.15s ease; }
    .m3-icon-btn:hover::after { opacity: 0.08; }
    .m3-icon-btn:active::after { opacity: 0.12; }
    .m3-dialog__content { margin-bottom: 24px; }
    .m3-dialog__result {
      font: var(--md-body-large);
      color: var(--md-primary);
      word-break: break-all;
      padding: 16px;
      background: var(--md-surface-container-highest);
      border-radius: var(--md-shape-md);
      text-align: center;
    }
    .m3-dialog__actions { display: flex; flex-direction: column; gap: 8px; }

    .m3-ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.2;
      transform: scale(0);
      pointer-events: none;
    }

    cap-widget { display: block; }

    @media (max-width: 640px) {
      cap-widget { transform: scale(0.9); transform-origin: center center; }
    }
    @media (max-width: 420px) {
      cap-widget { transform: scale(0.85); transform-origin: center center; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.5s ease; }
  </style>
</head>
<body>
  <main class="page">
    <section class="m3-card">
      <div class="m3-lang" role="group" data-i18n-aria="lang.label">
        <button class="m3-chip" type="button" data-lang="en" onclick="setLocale('en')">EN</button>
        <button class="m3-chip" type="button" data-lang="zh-CN" onclick="setLocale('zh-CN')">简体</button>
        <button class="m3-chip" type="button" data-lang="zh-TW" onclick="setLocale('zh-TW')">繁體</button>
      </div>

      <div class="m3-card__header">
        <h1 class="m3-headline" data-i18n="form.title">Shorten your URLs</h1>
        <p class="m3-subtitle" data-i18n="form.subtitle">Fast, Secure, and Reliable URL Shortening Service</p>
      </div>

      <div class="m3-card__body">
        <form id="shortenForm" onsubmit="handleSubmit(event)">
          <label class="m3-text-field">
            <input
              class="m3-text-field__input"
              type="text"
              id="urlInput"
              placeholder=" "
              autocomplete="off"
              spellcheck="false"
              aria-describedby="notice">
            <span class="m3-text-field__label" data-i18n="field.label">Enter URL to shorten</span>
          </label>
          <button class="m3-btn m3-btn--block" type="submit" id="submitBtn">
            <span class="m3-btn__label" data-i18n="button.shorten">Shorten</span>
          </button>
          <div id="notice" role="alert" aria-live="polite"></div>
        </form>
      </div>

      <div class="m3-card__footer">
        <a class="m3-link" href="https://github.com/skydev233/Url-Shorten-Worker" target="_blank" rel="noopener">
          <span data-i18n="footer.source">View Source Code</span>
          <span>&rarr;</span>
        </a>
        <div class="m3-copyright">© 2020–<span data-year>2026</span> xyTom &amp; skydev233</div>
      </div>
    </section>
  </main>

  <!-- CAPTCHA Modal -->
  <div id="captchaModal" class="m3-scrim" role="dialog" aria-modal="true" aria-labelledby="captchaTitle">
    <div class="m3-dialog">
      <div class="m3-dialog__header">
        <h2 class="m3-dialog__title" id="captchaTitle" data-i18n="captcha.title">CAPTCHA Verification</h2>
        <button class="m3-icon-btn" type="button" onclick="closeModal('captchaModal')" data-i18n-aria="dialog.close" aria-label="Close">&times;</button>
      </div>
      <div class="m3-dialog__content">
        <p style="text-align: center; margin-bottom: 16px; color: var(--md-on-surface-variant); font: var(--md-body-medium);" data-i18n="captcha.prompt">
          Please complete the CAPTCHA to continue
        </p>
        <div style="display: flex; justify-content: center;">
          <cap-widget id="capWidget" data-cap-api-endpoint="https://captcha.gurl.eu.org/api/"></cap-widget>
        </div>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="resultModal" class="m3-scrim" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="m3-dialog">
      <div class="m3-dialog__header">
        <h2 class="m3-dialog__title" id="resultTitle" data-i18n="result.title">Short URL Generated</h2>
        <button class="m3-icon-btn" type="button" onclick="closeModal('resultModal')" data-i18n-aria="dialog.close" aria-label="Close">&times;</button>
      </div>
      <div class="m3-dialog__content">
        <div class="m3-dialog__result" id="resultUrl"></div>
      </div>
      <div class="m3-dialog__actions">
        <button class="m3-btn m3-btn--block" type="button" onclick="copyToClipboard()" data-i18n="copy.link">Copy Link</button>
        <button class="m3-btn m3-btn--tonal m3-btn--block" type="button" onclick="closeModal('resultModal')" data-i18n="dialog.close">Close</button>
      </div>
    </div>
  </div>

  <script>
    // ---- i18n ----
    (function () {
      var I18N = {
        'en': {
          'meta.title': 'URL Shortener · Fast & Secure',
          'form.title': 'Shorten your URLs',
          'form.subtitle': 'Fast, Secure, and Reliable URL Shortening Service',
          'field.label': 'Enter URL to shorten',
          'button.shorten': 'Shorten',
          'button.working': 'Generating…',
          'captcha.title': 'CAPTCHA Verification',
          'captcha.prompt': 'Please complete the CAPTCHA to continue',
          'result.title': 'Short URL Generated',
          'copy.link': 'Copy Link',
          'dialog.close': 'Close',
          'copy.copied': '✓ Copied',
          'copy.failed': 'Failed to copy',
          'error.empty': 'Please enter a URL',
          'error.invalid': 'Please enter a valid URL (must include http:// or https://)',
          'error.captcha': 'CAPTCHA verification failed. Please try again.',
          'error.unknown': 'Unknown error occurred',
          'error.network': 'Network error',
          'success.created': 'Short URL created successfully!',
          'footer.source': 'View Source Code',
          'lang.label': 'Language'
        },
        'zh-CN': {
          'meta.title': '短链接 · 快速安全',
          'form.title': '缩短你的链接',
          'form.subtitle': '快速、安全、可靠的短链接服务',
          'field.label': '输入要缩短的网址',
          'button.shorten': '缩短',
          'button.working': '生成中…',
          'captcha.title': '人机验证',
          'captcha.prompt': '请完成验证码以继续',
          'result.title': '短链接已生成',
          'copy.link': '复制链接',
          'dialog.close': '关闭',
          'copy.copied': '✓ 已复制',
          'copy.failed': '复制失败',
          'error.empty': '请输入网址',
          'error.invalid': '请输入有效的网址（需包含 http:// 或 https://）',
          'error.captcha': '验证码验证失败，请重试。',
          'error.unknown': '发生未知错误',
          'error.network': '网络错误',
          'success.created': '短链接创建成功！',
          'footer.source': '查看源码',
          'lang.label': '语言'
        },
        'zh-TW': {
          'meta.title': '短連結 · 快速安全',
          'form.title': '縮短你的連結',
          'form.subtitle': '快速、安全、可靠的短連結服務',
          'field.label': '輸入要縮短的網址',
          'button.shorten': '縮短',
          'button.working': '產生中…',
          'captcha.title': '人機驗證',
          'captcha.prompt': '請完成驗證碼以繼續',
          'result.title': '短連結已產生',
          'copy.link': '複製連結',
          'dialog.close': '關閉',
          'copy.copied': '✓ 已複製',
          'copy.failed': '複製失敗',
          'error.empty': '請輸入網址',
          'error.invalid': '請輸入有效的網址（需包含 http:// 或 https://）',
          'error.captcha': '驗證碼驗證失敗，請重試。',
          'error.unknown': '發生未知錯誤',
          'error.network': '網路錯誤',
          'success.created': '短連結建立成功！',
          'footer.source': '查看原始碼',
          'lang.label': '語言'
        }
      };

      var currentLocale = (function () {
        var saved = null;
        try { saved = localStorage.getItem('locale'); } catch (e) {}
        if (saved && I18N[saved]) return saved;
        var nav = (navigator.language || 'en').toLowerCase();
        if (nav.indexOf('zh') === 0) {
          if (nav.indexOf('tw') !== -1 || nav.indexOf('hk') !== -1 || nav.indexOf('hant') !== -1) return 'zh-TW';
          return 'zh-CN';
        }
        return 'zh-CN';
      })();

      function t(key) {
        var dict = I18N[currentLocale] || I18N.en || {};
        return dict[key] != null ? dict[key] : (I18N.en && I18N.en[key] != null ? I18N.en[key] : key);
      }

      function apply() {
        document.documentElement.lang = currentLocale;
        document.title = t('meta.title');
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
          el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
        });
        document.querySelectorAll('.m3-chip').forEach(function (chip) {
          chip.classList.toggle('active', chip.getAttribute('data-lang') === currentLocale);
        });
      }

      window.setLocale = function (locale) {
        if (!I18N[locale]) return;
        currentLocale = locale;
        try { localStorage.setItem('locale', locale); } catch (e) {}
        apply();
        if (window.onLocaleChange) window.onLocaleChange();
      };

      window.t = t;

      document.addEventListener('DOMContentLoaded', function () {
        apply();
        document.querySelectorAll('[data-year]').forEach(function (el) {
          el.textContent = new Date().getFullYear();
        });
      });
    })();

    // ---- App logic ----
    const state = {
      captchaToken: null,
      isProcessing: false,
      pendingUrl: null,
      generatedUrl: null
    };

    const elements = {
      form: document.getElementById('shortenForm'),
      input: document.getElementById('urlInput'),
      submitBtn: document.getElementById('submitBtn'),
      notice: document.getElementById('notice'),
      captchaModal: document.getElementById('captchaModal'),
      resultModal: document.getElementById('resultModal'),
      resultUrl: document.getElementById('resultUrl'),
      capWidget: document.getElementById('capWidget')
    };

    document.addEventListener('DOMContentLoaded', () => {
      if (elements.capWidget) {
        elements.capWidget.addEventListener('solve', (e) => {
          state.captchaToken = e.detail.token;
          closeModal('captchaModal');
          if (state.pendingUrl) {
            performShortening(state.pendingUrl);
            state.pendingUrl = null;
          }
        });

        elements.capWidget.addEventListener('error', () => {
          showNotice(t('error.captcha'), 'error');
        });

        elements.capWidget.addEventListener('reset', () => {
          state.captchaToken = null;
        });
      }

      elements.input.addEventListener('input', () => {
        const value = elements.input.value.trim();
        elements.input.classList.toggle('m3-invalid', value && !isValidUrl(value));
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal('captchaModal');
          closeModal('resultModal');
        }
      });
    });

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch {
        return false;
      }
    }

    function handleSubmit(event) {
      event.preventDefault();
      if (state.isProcessing) return;

      const url = elements.input.value.trim();

      if (!url) {
        showNotice(t('error.empty'), 'error');
        elements.input.focus();
        return;
      }

      if (!isValidUrl(url)) {
        showNotice(t('error.invalid'), 'error');
        elements.input.classList.add('m3-invalid');
        elements.input.focus();
        return;
      }

      elements.input.classList.remove('m3-invalid');
      clearNotice();

      if (!state.captchaToken) {
        state.pendingUrl = url;
        openModal('captchaModal');
        return;
      }

      performShortening(url);
    }

    async function performShortening(url) {
      if (state.isProcessing) return;

      state.isProcessing = true;
      setLoading(true);

      try {
        const response = await fetch(window.location.origin, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url, captcha_token: state.captchaToken })
        });

        const data = await response.json();

        if (data.status === 200) {
          state.generatedUrl = window.location.origin + (data.key.charAt(0) === '/' ? data.key : '/' + data.key);
          elements.resultUrl.textContent = state.generatedUrl;
          elements.input.value = '';

          resetCaptcha();

          showNotice(t('success.created'), 'success');
          setTimeout(() => {
            openModal('resultModal');
            clearNotice();
          }, 500);
        } else {
          const errorMsg = data.error || t('error.unknown');
          showNotice(errorMsg, 'error');

          if (data.captcha_required || errorMsg.toLowerCase().includes('captcha')) {
            resetCaptcha();
          }
        }
      } catch (error) {
        showNotice(t('error.network') + ': ' + error.message, 'error');
        resetCaptcha();
      } finally {
        state.isProcessing = false;
        setLoading(false);
      }
    }

    function resetCaptcha() {
      state.captchaToken = null;
      if (elements.capWidget && typeof elements.capWidget.reset === 'function') {
        try { elements.capWidget.reset(); } catch (error) { /* ignore */ }
      }
    }

    async function copyToClipboard() {
      if (!state.generatedUrl) return;

      const copyBtn = document.querySelector('#resultModal .m3-btn:first-child');
      const originalText = t('copy.link');

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(state.generatedUrl);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = state.generatedUrl;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }

        copyBtn.textContent = t('copy.copied');
        copyBtn.classList.add('m3-btn--tonal');
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.classList.remove('m3-btn--tonal');
        }, 2000);
      } catch (error) {
        showNotice(t('copy.failed'), 'error');
      }
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) {
        modal.classList.remove('open');
        document.body.style.overflow = '';

        if (modalId === 'captchaModal' && !state.captchaToken) {
          state.pendingUrl = null;
          resetCaptcha();
        }
      }
    }

    function showNotice(message, type = 'error') {
      const el = document.createElement('div');
      el.className = 'm3-notice ' + (type === 'success' ? 'm3-notice--success' : 'm3-notice--error') + (type === 'error' ? ' animate-shake' : '');
      el.textContent = message;
      elements.notice.innerHTML = '';
      elements.notice.appendChild(el);
    }

    function clearNotice() {
      elements.notice.innerHTML = '';
    }

    function setLoading(loading) {
      elements.submitBtn.disabled = loading;
      const label = elements.submitBtn.querySelector('.m3-btn__label');
      if (loading) {
        label.innerHTML = '<span class="m3-spinner"></span>' + t('button.working');
      } else {
        label.textContent = t('button.shorten');
      }
    }

    ['captchaModal', 'resultModal'].forEach((id) => {
      const modal = document.getElementById(id);
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal(id);
      });
    });

    document.querySelectorAll('.m3-btn, .m3-icon-btn, .m3-link').forEach((el) => {
      el.addEventListener('pointerdown', (e) => {
        const r = el.getBoundingClientRect();
        const d = Math.max(r.width, r.height) * 2;
        const ripple = document.createElement('span');
        ripple.className = 'm3-ripple';
        ripple.style.width = ripple.style.height = d + 'px';
        ripple.style.left = (e.clientX - r.left - d / 2) + 'px';
        ripple.style.top = (e.clientY - r.top - d / 2) + 'px';
        el.appendChild(ripple);
        requestAnimationFrame(() => {
          ripple.style.transition = 'transform 0.5s ease, opacity 0.6s ease';
          ripple.style.transform = 'scale(1)';
          ripple.style.opacity = '0';
        });
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>
</body>
</html>
